<body class="overflow-hidden">
    <div id="playground" class=" w-full h-full"></div>

    <audio id="music" src="" loop crossorigin="anonymous"></audio>
    <audio id="sfx" src="" crossorigin="anonymous"></audio>

    <section id="alert-win" class=" absolute top-0 w-full h-full hidden justify-center items-center p-3 bg-slate-950/70">
        <div id="alert-card" class=" lg:w-1/3 md:w-1/3 w-full border-t-2 p-5 rounded-md bg-slate-900/70 flex  flex-col justify-between min-h-40 gap-5" style="border-color: orange;">
            <p id="alert-message" class=" w-full">Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur aperiam velit quae reprehenderit vero placeat eveniet molestias corporis modi iure tempora amet, explicabo eaque soluta maiores ducimus exercitationem optio id!</p>
            <div id="alert-opts" class=" hidden w-full"></div>
            <div id="alert-input" class="w-full hidden">
                <input type="text" class=" w-full input rounded-full input-bordered">
            </div>
            <div id="alert-btns" class="flex justify-between">
                <button class="btn btn-outline">Cancel</button>
                <button class="btn bg-orange-400 hover:bg-orange-600 border-0 text-slate-900">Proceed</button>
            </div>
        </div>
    </section>

    <section id="loadwin" class="absolute top-0 w-full h-full overflow-hidden bg-slate-900">
        <img id="loadimg" src="" class=" w-full h-full object-cover absolute opacity-70" alt="Poster">
        <div class=" absolute top-0 left-0 w-full h-full flex justify-center items-center">
            <p id="loadtitle" class=" lg:text-8xl md:text-8xl text-7xl text-center drop-shadow-lg">Hello</p>
        </div>
        <div class=" flex flex-col items-center justify-center absolute bottom-0 left-0 w-full pb-16">
            <p id="loadstatus" class="hidden w-full text-center md:text-3xl text-xl text-slate-100 animate-pulse">Loading...</p>
            <div id="loadspin" class=" w-10 aspect-square">
                <!-- <img class=" w-full h-full animate-spin" src="./assets/svgs/spinner.svg" alt="Loading"> -->
                <div class=" loading w-10 h-10 bg-slate-100"></div>
                <!-- <div class=" loading-bars bg-slate-100 w-10 h-5 scale-150"></div> -->
                <!-- <div class=" loading-dots bg-slate-100 w-10 h-5 scale-200"></div> -->
                <!-- <div class=" loading-ring bg-slate-100 w-10 h-10"></div> -->
            </div>
        </div>
    </section>
