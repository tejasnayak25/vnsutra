<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <meta property="og:title" content="VN-Sutra">
    <meta property="og:description" content="An introduction to VN-Sutra, visual novel SDK">
    <meta property="og:url" content="https://vnsutra.vercel.app/">
    <meta property="og:image" content="https://vnsutra.vercel.app/assets/screenshots/screenshot1.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="VN-Sutra">
    <meta name="twitter:description" content="An introduction to VN-Sutra, visual novel SDK">
    <meta name="twitter:url" content="https://vnsutra.vercel.app/" />
    <meta name="twitter:image" content="https://vnsutra.vercel.app/assets/screenshots/screenshot1.png" />

    <meta name="description" content="An introduction to VN-Sutra, visual novel SDK" />
    <meta name="keywords" content="visual novel, SDK, game development, interactive fiction, VN-Sutra" />
    <meta name="author" content="Tejas Nayak" />
    <link rel="canonical" href="https://vnsutra.vercel.app/" />

    <title>VN-Sutra</title>
    <link rel="stylesheet" href="./css/output.css">
    <link id="icon" rel="shortcut icon" href="./assets/images/logo.png" type="image/png">
    <link rel="manifest" href="./game/manifest.json" crossorigin="use-credentials">
</head>
<body class="overflow-hidden">
    <div id="playground" class=" w-full h-full" role="application" aria-label="VN-Sutra game area"></div>

    <!-- Install App Prompt (hidden by default, shown by JS) -->
    <!-- Mobile (default): full-width bottom sheet. Desktop (sm+): compact floating pill at bottom-right. -->
    <div id="install-app-utility" class="hidden fixed bottom-4 left-4 right-4 sm:bottom-6 sm:right-6 sm:left-auto sm:w-auto z-50 bg-slate-800 text-white rounded-lg sm:rounded-xl shadow-lg px-4 py-3 sm:px-6 sm:py-4 text-base flex-col sm:flex-row items-center sm:items-center gap-3 sm:gap-4">
        <img src="./assets/images/logo.png" alt="App Logo" class="w-12 h-12 sm:w-10 sm:h-10 rounded-md shadow-md" />
        <div class="flex-1 text-center sm:text-left">
            <div class="font-medium">Install this app for a better experience!</div>
            <div class="text-sm text-slate-300 mt-1 hidden sm:block">Get offline access and faster launches.</div>
        </div>
        <div class="flex flex-col sm:flex-row items-center gap-2 w-full sm:w-auto">
            <button id="install-app-btn" class="w-full sm:w-auto bg-indigo-600 text-white rounded-md px-4 py-2 text-base font-medium hover:bg-indigo-700 focus:outline-none">Install</button>
            <button id="install-app-close" aria-label="Close install prompt" class="w-full sm:w-9 sm:h-9 flex items-center justify-center bg-transparent border border-slate-600 hover:bg-slate-700 rounded-md text-white text-sm sm:text-xl cursor-pointer px-3 py-2">
                <span class="sm:hidden">Continue in Browser</span>
                <span class="hidden sm:inline">&times;</span>
            </button>
        </div>
    </div>

    <audio id="music" src="" loop crossorigin="anonymous" aria-label="Background music"></audio>
    <audio id="sfx" src="" crossorigin="anonymous" aria-label="Sound effects"></audio>

    <section id="alert-win" class="fixed inset-0 z-50 hidden justify-center items-center p-4 sm:p-6 bg-[#080612]/75 backdrop-blur-md opacity-0 transition-opacity duration-200" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Game dialog">
        <div id="alert-card" class="relative w-full max-w-md rounded-2xl bg-[#141126]/95 border border-white/10 shadow-[0_24px_64px_rgba(0,0,0,0.85),0_4px_20px_rgba(184,138,239,0.15)] flex flex-col justify-between overflow-hidden transition-all duration-200 transform scale-95 opacity-0" role="document" tabindex="-1">
            <!-- Top luminous accent line -->
            <div id="alert-accent-line" class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#B88AEF] to-transparent opacity-85 pointer-events-none"></div>

            <div class="p-5 sm:p-6 flex flex-col gap-4">
                <!-- Header with Icon, Category & Close Button -->
                <div id="alert-header" class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div id="alert-icon-wrap" class="w-10 h-10 rounded-xl flex items-center justify-center bg-white/[0.06] border border-white/10 text-[#B88AEF] shadow-inner shrink-0">
                            <span id="alert-icon" class="flex items-center justify-center"></span>
                        </div>
                        <div class="flex flex-col">
                            <span id="alert-badge" class="text-[10px] uppercase font-bold tracking-wider text-[#B88AEF] opacity-90">Notice</span>
                            <h3 id="alert-title" class="text-base sm:text-lg font-semibold text-white tracking-wide">Confirmation</h3>
                        </div>
                    </div>
                    <button id="alert-close-x" type="button" class="w-8 h-8 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 transition-colors cursor-pointer" aria-label="Close dialog">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Highlighted Query / Message Box -->
                <div id="alert-message-wrap" class="w-full max-h-[50vh] overflow-y-auto pr-1">
                    <div id="alert-query-box" class="w-full px-4 py-3 sm:px-5 sm:py-3.5 rounded-xl bg-white/[0.05] border border-white/10 border-l-4 border-l-[#B88AEF] shadow-inner transition-all duration-200">
                        <p id="alert-message" class="text-base sm:text-lg font-semibold text-white leading-relaxed whitespace-pre-line tracking-wide"></p>
                    </div>
                </div>

                <!-- Choice Options (for story choices) -->
                <div id="alert-opts" class="hidden w-full max-h-[48vh] overflow-y-auto"></div>

                <!-- Input Field (for user input prompts) -->
                <div id="alert-input" class="w-full hidden">
                    <input type="text" class="w-full px-4 py-2.5 rounded-xl bg-white/[0.06] border border-white/15 focus:border-[#B88AEF] focus:ring-2 focus:ring-[#B88AEF]/25 text-white placeholder-white/40 text-sm sm:text-base outline-none transition-all duration-200">
                </div>

                <!-- Action Buttons -->
                <div id="alert-btns" class="flex justify-end items-center gap-3 pt-3 mt-1 border-t border-white/[0.08]">
                    <button class="btn btn-outline">Cancel</button>
                    <button class="btn bg-orange-400 hover:bg-orange-600 border-0 text-slate-900">Proceed</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Disclaimer Modal -->
    <section id="disclaimer-modal" class="fixed inset-0 z-50 hidden justify-center items-center p-4 sm:p-6 bg-[#080612]/80 backdrop-blur-md opacity-0 transition-opacity duration-200" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Disclaimer">
        <div id="disclaimer-card" class="relative w-full max-w-lg rounded-2xl bg-[#141126]/95 border border-white/10 shadow-[0_24px_64px_rgba(0,0,0,0.85),0_4px_20px_rgba(184,138,239,0.15)] flex flex-col justify-between overflow-hidden transition-all duration-200 transform scale-95 opacity-0" role="document" tabindex="-1">
            <!-- Top luminous accent line -->
            <div id="disclaimer-accent-line" class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#B88AEF] to-transparent opacity-85 pointer-events-none"></div>

            <div class="p-5 sm:p-6 flex flex-col gap-4">
                <!-- Header with Icon, Category & Close Button -->
                <div id="disclaimer-header" class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div id="disclaimer-icon-wrap" class="w-10 h-10 rounded-xl flex items-center justify-center bg-white/[0.06] border border-white/10 text-[#B88AEF] shadow-inner shrink-0">
                            <span id="disclaimer-icon" class="flex items-center justify-center">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                                </svg>
                            </span>
                        </div>
                        <div class="flex flex-col">
                            <span id="disclaimer-badge" class="text-[10px] uppercase font-bold tracking-wider text-[#B88AEF] opacity-90">Content Advisory</span>
                            <h3 id="disclaimer-title" class="text-base sm:text-lg font-semibold text-white tracking-wide">Disclaimer & Guidelines</h3>
                        </div>
                    </div>
                    <button id="disclaimer-close-x" type="button" class="w-8 h-8 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 transition-colors cursor-pointer" aria-label="Close disclaimer">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Body Content with Styled Card Wrapper -->
                <div id="disclaimer-body-wrap" class="w-full max-h-[50vh] sm:max-h-[56vh] overflow-y-auto pr-1">
                    <div id="disclaimer-body" class="w-full px-4 py-3 sm:px-5 sm:py-3.5 rounded-xl bg-white/[0.04] border border-white/10 shadow-inner text-sm leading-relaxed text-[#F8F2FF]/85"></div>
                </div>

                <!-- Action Footer -->
                <div class="flex justify-end items-center gap-3 pt-3 mt-1 border-t border-white/[0.08]">
                    <button id="disclaimer-btn" class="px-6 py-2.5 rounded-xl font-semibold text-sm tracking-wide bg-gradient-to-r from-[#B88AEF] to-[#A470E0] hover:from-[#C79CFF] hover:to-[#B380EE] text-[#141126] shadow-[0_4px_16px_rgba(184,138,239,0.3)] transition-all duration-200 active:scale-95 cursor-pointer">I Understand</button>
                </div>
            </div>
        </div>
    </section>

    <section id="loadwin" class="absolute top-0 w-full h-full overflow-hidden bg-slate-900" role="status" aria-live="polite" aria-label="Loading screen">
        <img id="loadimg" src="" class=" w-full h-full object-cover absolute opacity-70" alt="Poster">
        <div id="splash-layer" class="absolute top-0 left-0 w-full h-full flex flex-col justify-center items-center bg-slate-950/95 z-50 pointer-events-none">
            <img id="splash-logo" src="" class="max-w-[50vw] max-h-[36vh] object-contain opacity-0" alt="Splash logo">
            <p id="splash-label" class="mt-6 text-slate-100 text-xl md:text-2xl text-center px-6 opacity-0"></p>
        </div>
        <div class=" absolute top-0 left-0 w-full h-full flex justify-center items-center">
            <p id="loadtitle" class=" lg:text-8xl md:text-8xl text-7xl text-center drop-shadow-lg">VN-Sutra</p>
        </div>
        <div class=" flex flex-col items-center justify-center absolute bottom-0 left-0 w-full pb-16">
            <p id="loadstatus" class="hidden w-full text-center md:text-3xl text-xl text-slate-100 animate-pulse px-10">Loading...</p>
            <div id="loadspin" class=" w-10 aspect-square">
                <!-- <img class=" w-full h-full animate-spin" src="./assets/svgs/spinner.svg" alt="Loading"> -->
                <div class=" loading w-10 h-10 bg-slate-100"></div>
                <!-- <div class=" loading-bars bg-slate-100 w-10 h-5 scale-150"></div> -->
                <!-- <div class=" loading-dots bg-slate-100 w-10 h-5 scale-200"></div> -->
                <!-- <div class=" loading-ring bg-slate-100 w-10 h-10"></div> -->
            </div>
        </div>
    </section>
    
    <script type="module">
        import { EVENTS } from "./vnsutra_modules/constants.js";

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
                console.log('Service Worker registered with scope:', registration.scope);
                
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed') {
                            if (navigator.serviceWorker.controller) {
                                window.dispatchEvent(new CustomEvent(EVENTS.UPDATE_AVAILABLE));
                            } else {
                                console.log('Content is cached for offline use.');
                            }
                        }
                    };
                };
            })
            .catch(error => {
                console.log('Service Worker registration failed:', error);
            });
        }
    </script>
    <script type="module" src="./vnsutra_modules/init.js"></script>
</body>
</html>
